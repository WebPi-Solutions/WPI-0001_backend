name: "[DEV] Build & Push Backend"

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image (dev)
        run: |
          docker build \
            --platform linux/amd64 \
            -f docker/Dockerfile \
            -t ghcr.io/webpi-solutions/wpi-0001_backend:dev .

      - name: Push Docker image (dev)
        run: |
          docker push ghcr.io/webpi-solutions/wpi-0001_backend:dev