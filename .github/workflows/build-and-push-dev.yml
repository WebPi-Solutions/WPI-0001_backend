name: "[DEV] Build & Push Backend"

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image (dev)
        run: |
          docker build \
            --platform linux/amd64 \
            -f docker/Dockerfile \
            -t ghcr.io/webpi-solutions/wpi-0001_backend:dev .

      - name: Push Docker image (dev)
        run: |
          docker push ghcr.io/webpi-solutions/wpi-0001_backend:dev

      - name: Trigger Portainer stack update
        run: |
          curl --fail --location "${DEPLOYS_URL}/update-stack" \
            --header 'Content-Type: application/json' \
            --data "{
              \"project_code\": \"${DEPLOYS_PROJECT_CODE}\",
              \"api_key\": \"${DEPLOYS_API_KEY}\"
            }"
        env:
          DEPLOYS_URL: ${{ secrets.DEPLOYS_URL }}
          DEPLOYS_API_KEY: ${{ secrets.DEPLOYS_API_KEY }}
          DEPLOYS_PROJECT_CODE: ${{ secrets.DEPLOYS_PROJECT_CODE }}